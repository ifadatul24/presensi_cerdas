version: '3.8'

services:
  # ==========================================
  # Database Relasional + Vektor (PostgreSQL + pgvector)
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: presensi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-presensi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presensi_secret_pass}
      POSTGRES_DB: ${DB_NAME:-presensi_cerdas_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presensi_user} -d ${DB_NAME:-presensi_cerdas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # In-Memory Cache & Session Cooldown (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: presensi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

  # ==========================================
  # Message Broker (RabbitMQ)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: presensi_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Web Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  # ==========================================
  # RTSP Media Stream Simulator (MediaMTX)
  # Digunakan untuk emulasi stream kamera RTSP saat development
  # ==========================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: presensi_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP stream
      - "8888:8888"   # HLS stream
      - "8889:8889"   # WebRTC

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:

